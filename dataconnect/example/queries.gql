
query ListUsers
@auth(level: PUBLIC, insecureReason: "Public user directory access is intentional for this prototype.") {
  users {
    idNum
    name
    college
    role
  }
}

query ListSchedules
@auth(level: PUBLIC, insecureReason: "Schedule retrieval is public for this prototype and must be restricted to authorized users before production.") {
  schedules {
    schedId
    roomId
    roomInfo {
      roomNumber
      building
      floor
    }
    day
    fromTime
    toTime
  }
}

query ListReservations
@auth(level: PUBLIC, insecureReason: "Reservation listing is intentionally public for this prototype.") {
  reservations {
    resId
    schedId
    idNum
    reservationDate
    status
  }
}
