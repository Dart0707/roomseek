query ListUsers
@auth(level: PUBLIC, insecureReason: "Public user directory access is intentional for this prototype.") {
  users {
    idNum
    name
    college
    role
  }
}

query ListSchedules
@auth(level: PUBLIC, insecureReason: "Room schedules are intentionally public for availability lookup.") {
  schedules {
    schedId
    room
    day
    fromTime
    toTime
    isOccupied
  }
}

query ListReservations
@auth(level: PUBLIC, insecureReason: "Reservation listing is intentionally public for this prototype.") {
  reservations {
    resId
    schedId
    idNum
    status
  }
}
