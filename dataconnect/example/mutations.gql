mutation UpsertUser($idNum: String!, $name: String!, $college: String!, $role: Role!)
@auth(level: PUBLIC, insecureReason: "User creation is public for this prototype and must be restricted before production.") {
  user_upsert(data: { idNum: $idNum, name: $name, college: $college, role: $role })
}


mutation CreateSchedule(
  $roomId: String!
  $day: String!
  $fromTime: String!
  $toTime: String!
) @auth(level: PUBLIC, insecureReason: "Schedule creation is public for this prototype and must be restricted to administrators before production.") {
  schedule_insert(
    data: {
      roomId: $roomId
      day: $day
      fromTime: $fromTime
      toTime: $toTime
    }
  )
}


mutation CreateReservation(
  $schedId: String!
  $idNum: String!
  $reservationDate: Date!
  $status: ReservationStatus
) @auth(level: PUBLIC, insecureReason: "Reservation creation is public for this prototype and must be restricted to authenticated users before production.") {
  reservation_insert(
    data: {
      schedId: $schedId
      idNum: $idNum
      reservationDate: $reservationDate
      status: $status
    }
  )
}

mutation CreateRoom(
  $roomNumber: String!
  $building: String!
  $floor: Int!
) @auth(level: PUBLIC, insecureReason: "Room creation is public for this prototype and must be restricted to administrators before production.") {
  room_insert(
    data: {
      roomNumber: $roomNumber
      building: $building
      floor: $floor
    }
  )
}
