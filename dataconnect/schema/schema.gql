
type User @table(key: "idNum") {
  idNum: String! @unique
  email: String @unique
  passwordHash: String
  name: String!
  college: String!
  role: Role!
}

enum Role {
  STUDENT
  TEACHER
  ADMIN
}

type Room @table(key: "roomId") {
  roomId: String! @default(expr: "uuidV4()")
  roomNumber: String!
  building: String!
  floor: Int!
}

type Schedule @table(key: "schedId") {
  schedId: String! @default(expr: "uuidV4()")

  roomInfo: Room!
    @ref(fields: ["roomId"], references: ["roomId"])
  roomId: String!

  day: String!
  fromTime: String!
  toTime: String!
}

type Reservation @table(key: "resId") {
  resId: String! @default(expr: "uuidV4()")

  schedule: Schedule!
    @ref(fields: ["schedId"], references: ["schedId"])
  schedId: String!

  user: User!
    @ref(fields: ["idNum"], references: ["idNum"])
  idNum: String!

  # New field - specific calendar date
  reservationDate: Date!

  status: ReservationStatus! @default(value: PENDING)
}

enum ReservationStatus {
  PENDING
  APPROVED
  REJECTED
}
