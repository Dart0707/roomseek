type User @table(key: "idNum") {
  idNum: String! @unique
  email: String @unique
  passwordHash: String
  name: String!
  college: String!
  role: Role!
}

enum Role {
  STUDENT
  TEACHER
  ADMIN
}

type Schedule @table(key: "schedId") {
  schedId: String! @default(expr: "uuidV4()")
  room: String!
  day: String! @default(value: "Monday")
  fromTime: String!
  toTime: String!
  isOccupied: Boolean! @default(value: false)
}

type Reservation @table(key: "resId") {
  resId: String! @default(expr: "uuidV4()")
  schedule: Schedule!
    @ref(fields: ["schedId"], references: ["schedId"])
  schedId: String!
  user: User! @ref(fields: ["idNum"], references: ["idNum"])
  idNum: String!
  status: ReservationStatus! @default(value: PENDING)
}
enum ReservationStatus {
  PENDING
  APPROVED
  REJECTED
}